# TEMPLATE for HTTPS. Not used by docker-compose.proxy.yml and not tested in this project: it needs a
# real domain and certificates.
#
# How to use it:
#   1. Get a certificate for your domain (for example with certbot) and mount the folder read-only into
#      the proxy container, for example at /etc/nginx/certs.
#   2. Keep everything from default.conf above the `server { ... }` block (zones, cache, gzip, resolver).
#   3. Replace the single `server { listen 8080; ... }` block with the two blocks below, keeping the
#      `location` blocks from default.conf inside the HTTPS one.
#   4. Publish 80 and 443 instead of 8080 in docker-compose.proxy.yml. The unprivileged image cannot
#      bind ports below 1024 inside the container, so publish "80:8080" and "443:8443" and listen on 8080 / 8443 here.

# Send plain HTTP to HTTPS
server {
    listen 8080;
    server_name example.com;

    # Certificate renewal (certbot webroot mode) needs this path to stay on HTTP
    location /.well-known/acme-challenge/ {
        root /tmp/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to use HTTPS only. Start with a short time (the web app already sends one day).
    # Raise it only after HTTPS has worked for a while: browsers remember it and it is hard to undo.
    # The web app sends this header itself, so adding it here would duplicate it. Use ONE of them.
    # add_header Strict-Transport-Security "max-age=86400" always;

    # ... the same client_*_timeout, limit_conn and location blocks as in default.conf ...
}
