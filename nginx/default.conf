# Reverse proxy for the web app and the API, used by docker-compose.proxy.yml.
#
#   http://localhost:8080/        -> web app
#   http://localhost:8080/api/*   -> API (the /api prefix is removed)
#
# One address for both means the browser never makes a cross-origin request: no CORS, and the web
# app's Content Security Policy only needs 'self'. The API and web containers are not published,
# so every request passes the limits below.
#
# The apps set their own security headers (single source of truth), so nginx adds none.
# TLS is not set up here. See nginx/README.md for a template.

server_tokens off;

# Per client address: 20 requests a second in total, and 12 a minute for batch uploads. The API has
# its own, stricter, limits per route. These are a first line of defence against floods.
limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=batch:10m   rate=12r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# Answers that only change when the model is retrained are kept for 5 minutes
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=api_static:5m max_size=20m inactive=10m use_temp_path=off;

# Compress text. Responses that are already compressed are left alone.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/csv text/javascript text/plain image/svg+xml;

# Container names are looked up again every 10 seconds, so a restarted container is found again
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Slow or stuck clients are dropped quickly
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  1m;   # JSON requests are tiny; the batch upload below gets more
    limit_conn perip 30;

    # Used by the container health check. Not proxied, not counted.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Error answers from nginx itself, in the same shape as the API's own errors
    location @api_too_large {
        default_type application/json;
        return 413 '{"detail":["Request body is too large."]}';
    }
    location @api_busy {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"detail":["Too many requests. Try again in a few seconds."]}';
    }
    location @api_down {
        default_type application/json;
        return 502 '{"detail":["The API is not reachable. Try again in a moment."]}';
    }

    # ----- API: batch upload (CSV up to 5 MB) -----
    location = /api/predict/batch {
        client_max_body_size 6m;
        client_body_timeout  30s;
        limit_req zone=general burst=40 nodelay;
        limit_req zone=batch   burst=4  nodelay;
        include /etc/nginx/proxy-api.inc;
    }

    # ----- API: data that only changes when the model is retrained -----
    location ~ ^/api/(meta|insights|template\.csv)$ {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/proxy-api.inc;

        # Ask the API for an uncompressed copy so one cached copy serves everyone. nginx compresses it
        # on the way out. The API answers Vary: Accept-Encoding, which no longer matters then.
        proxy_set_header Accept-Encoding "";
        proxy_ignore_headers Vary;
        proxy_cache api_static;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ----- API: everything else -----
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/proxy-api.inc;
    }

    # ----- Web app -----
    location / {
        limit_req zone=general burst=60 nodelay;

        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_hide_header X-Powered-By;
    }
}
