name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest

  web:
    name: Web tests, lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts
      - run: npm test
      - run: npm run lint
      # The build comes first: it generates the Next.js route types (LayoutProps, PageProps) that tsc needs
      - run: npm run build
      - run: npx tsc --noEmit

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:3000/
      - name: Smoke test the stack behind nginx
        run: |
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -D - -o /dev/null http://localhost:8080/api/meta | grep -i "x-cache-status"
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml down
